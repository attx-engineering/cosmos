# Unit tests of the WarpLink plugin's Python, which need only the standard
# library and pytest.

name: WarpLink Plugin Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "openc3-cosmos-warplink/**"
      - ".github/workflows/warplink_plugin_tests.yml"

jobs:
  unit-test:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run unit tests
        run: |
          python -m pytest ./test/
        working-directory: openc3-cosmos-warplink
