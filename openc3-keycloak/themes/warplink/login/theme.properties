# WarpLink branding for the Keycloak login pages.
#
# Only the logo and a handful of strings are overridden - everything else is
# inherited, so Keycloak upgrades bring their own markup and styling changes
# without this theme needing to keep up.
parent=keycloak.v2
import=common/keycloak

# NOTE: setting styles replaces the parent's list rather than adding to it, so
# the inherited stylesheet has to be named again before ours.
styles=css/styles.css css/warplink.css
